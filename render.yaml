databases:
  - name: casa-limpa-db
    plan: free
    databaseName: casa_limpa
    postgresMajorVersion: "16"

services:
  - type: web
    name: casa-limpa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casa-limpa-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.6"
