<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Casa Limpa</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Tela 1: Escolha de perfil -->
        <div class="welcome-screen" id="telaEscolha">
            <div class="logo">🏠</div>
            <h1>Casa Limpa</h1>
            <p class="subtitle">Gerenciador de Atividades Domésticas</p>
            <p class="version-info">Versão 1.3.0 — Atualizado em 02/04/2026</p>

            <div class="role-selection">
                <p class="role-label">Quem é você?</p>

                <div class="profiles-grid">
                    <div class="profile-card morador" onclick="escolherPerfil('alexandre')" data-perfil="alexandre">
                        <div class="profile-avatar">
                            <img class="avatar-img" src="" alt="Alexandre" onerror="this.style.display='none'">
                            <div class="avatar-icon">👨</div>
                        </div>
                        <div class="profile-name">Alexandre</div>
                        <div class="profile-role">Morador</div>
                    </div>

                    <div class="profile-card morador" onclick="escolherPerfil('suzana')" data-perfil="suzana">
                        <div class="profile-avatar">
                            <img class="avatar-img" src="" alt="Suzana" onerror="this.style.display='none'">
                            <div class="avatar-icon">👩</div>
                        </div>
                        <div class="profile-name">Suzana</div>
                        <div class="profile-role">Moradora</div>
                    </div>

                    <div class="profile-card morador" onclick="escolherPerfil('duda')" data-perfil="duda">
                        <div class="profile-avatar">
                            <img class="avatar-img" src="" alt="Duda" onerror="this.style.display='none'">
                            <div class="avatar-icon">👧</div>
                        </div>
                        <div class="profile-name">Duda</div>
                        <div class="profile-role">Moradora</div>
                    </div>

                    <div class="profile-card morador" onclick="escolherPerfil('leo')" data-perfil="leo">
                        <div class="profile-avatar">
                            <img class="avatar-img" src="" alt="Léo" onerror="this.style.display='none'">
                            <div class="avatar-icon">👦</div>
                        </div>
                        <div class="profile-name">Léo</div>
                        <div class="profile-role">Morador</div>
                    </div>

                    <div class="profile-card empregada" onclick="escolherPerfil('solange')" data-perfil="solange">
                        <div class="profile-avatar">
                            <img class="avatar-img" src="" alt="Solange" onerror="this.style.display='none'">
                            <div class="avatar-icon">🧹</div>
                        </div>
                        <div class="profile-name">Solange</div>
                        <div class="profile-role">Empregada</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tela 2: Login com câmera ou senha (DUAL) -->
        <div class="welcome-screen hidden" id="telaLogin">
            <div class="login-header">
                <div class="login-avatar" id="loginAvatar">
                    <img id="loginAvatarImg" src="" alt="" style="display:none">
                    <div id="loginAvatarIcon">🔒</div>
                </div>
                <h1 id="loginTitulo">Entrar</h1>
            </div>

            <div class="login-tabs">
                <button class="login-tab active" onclick="mudarAbaLogin('camera')" id="tabCamera">
                    📷 Rosto
                </button>
                <button class="login-tab" onclick="mudarAbaLogin('senha')" id="tabSenha">
                    🔐 Senha
                </button>
            </div>

            <!-- ABA 1: Câmera -->
            <div class="login-content" id="abaCamera">
                <div id="loginErroCamera" class="lembrete-card hidden" style="border-left-color:var(--danger);background:var(--danger-bg);margin:1rem;">
                    <div class="lembrete-msg" id="loginErroMsgCamera"></div>
                </div>

                <div style="text-align:center;padding:1rem;background:rgba(255,255,255,0.1);border-radius:12px;margin:1rem;">
                    <video id="cameraPreview" width="300" height="300" style="border-radius:8px;max-width:100%;display:none;background:black;"></video>
                    <div id="cameraPlaceholder" style="color:white;padding:2rem;font-size:3rem;">📷</div>
                </div>

                <div style="padding:0 1rem;">
                    <button class="btn btn-primary btn-block" id="btnIniciarCamera" onclick="iniciarCamera()" style="background:white;color:var(--primary);margin-bottom:0.5rem;">
                        Iniciar Câmera
                    </button>
                    <button class="btn btn-primary btn-block hidden" id="btnCapturarRosto" onclick="capturarRosto()" style="background:#10b981;color:white;">
                        ✓ Verificar Rosto
                    </button>
                    <button class="btn btn-block mt-1" onclick="pararCamera()" style="color:white;background:transparent;border:1px solid rgba(255,255,255,0.3);">
                        ← Cancelar
                    </button>
                </div>
            </div>

            <!-- ABA 2: Senha -->
            <div class="login-content hidden" id="abaSenha">
                <div id="loginErroSenha" class="lembrete-card hidden" style="border-left-color:var(--danger);background:var(--danger-bg);margin-bottom:1rem;">
                    <div class="lembrete-msg" id="loginErroMsgSenha"></div>
                </div>

                <div class="form-group" style="padding:0 1rem;">
                    <label style="color:white">Senha</label>
                    <input type="password" class="form-control" id="loginSenha" placeholder="Digite sua senha"
                           onkeydown="if(event.key==='Enter')fazerLogin()" autofocus>
                </div>
                <div style="padding:0 1rem;">
                    <button class="btn btn-primary btn-block" onclick="fazerLogin()" style="background:white;color:var(--primary);">
                        Entrar
                    </button>
                    <button class="btn btn-block mt-1" onclick="voltarEscolha()" style="color:white;background:transparent;border:1px solid rgba(255,255,255,0.3);">
                        ← Voltar
                    </button>
                </div>
            </div>
        </div>

        <!-- Tela 3: Trocar senha obrigatória -->
        <div class="welcome-screen hidden" id="telaTrocarSenha">
            <div class="logo">🔐</div>
            <h1>Trocar Senha</h1>
            <p class="subtitle">Por segurança, crie uma nova senha pessoal</p>

            <div class="role-selection" style="max-width:320px">
                <div id="trocarErro" class="lembrete-card hidden" style="border-left-color:var(--danger);background:var(--danger-bg);margin-bottom:1rem">
                    <div class="lembrete-msg" id="trocarErroMsg"></div>
                </div>

                <div class="form-group">
                    <label style="color:white">Senha atual</label>
                    <input type="password" class="form-control" id="senhaAtual" placeholder="Senha que você usou para entrar">
                </div>
                <div class="form-group">
                    <label style="color:white">Nova senha (mínimo 4 caracteres)</label>
                    <input type="password" class="form-control" id="senhaNova" placeholder="Crie uma nova senha">
                </div>
                <div class="form-group">
                    <label style="color:white">Confirme a nova senha</label>
                    <input type="password" class="form-control" id="senhaConfirma" placeholder="Digite novamente"
                           onkeydown="if(event.key==='Enter')trocarSenha()">
                </div>
                <button class="btn btn-primary btn-block" onclick="trocarSenha()" style="background:white;color:var(--primary)">
                    Salvar Nova Senha
                </button>
            </div>
        </div>
    </div>

    <script>
        let perfilEscolhido = '';
        let senhaDigitada = '';

        // Verificar se já está logado e carregar fotos dos usuários
        document.addEventListener('DOMContentLoaded', async () => {
            // Carregar fotos de todos os usuários para os cards
            const perfis = ['alexandre', 'suzana', 'duda', 'leo', 'solange'];
            for (const perfil of perfis) {
                try {
                    const res = await fetch(`/api/usuarios/${perfil}`);
                    const data = await res.json();
                    if (data.foto) {
                        const card = document.querySelector(`[data-perfil="${perfil}"]`);
                        if (card) {
                            const img = card.querySelector('.avatar-img');
                            img.src = data.foto;
                            img.style.display = 'block';
                        }
                    }
                } catch(e) {}
            }

            // Verificar autenticação
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                if (data.logado) {
                    if (data.trocar_senha) {
                        perfilEscolhido = data.perfil;
                        mostrarTela('telaTrocarSenha');
                    } else {
                        window.location.href = data.papel === 'morador' ? '/patrao.html' : '/empregada.html';
                    }
                }
            } catch(e) {}
        });

        function mostrarTela(id) {
            document.getElementById('telaEscolha').classList.add('hidden');
            document.getElementById('telaLogin').classList.add('hidden');
            document.getElementById('telaTrocarSenha').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function escolherPerfil(perfil) {
            perfilEscolhido = perfil;
            const nomes = {
                'alexandre': { nome: 'Alexandre', icone: '👨' },
                'suzana': { nome: 'Suzana', icone: '👩' },
                'duda': { nome: 'Duda', icone: '👧' },
                'leo': { nome: 'Léo', icone: '👦' },
                'solange': { nome: 'Solange', icone: '🧹' }
            };
            const info = nomes[perfil] || { nome: perfil, icone: '🏠' };

            // Atualizar header
            document.getElementById('loginTitulo').textContent = info.nome;
            document.getElementById('loginAvatarIcon').textContent = info.icone;

            // Carregar foto do usuário
            fetch(`/api/usuarios/${perfil}`)
                .then(r => r.json())
                .then(data => {
                    if (data.foto) {
                        const img = document.getElementById('loginAvatarImg');
                        img.src = data.foto;
                        img.style.display = 'block';
                        document.getElementById('loginAvatarIcon').style.display = 'none';
                    }
                })
                .catch(() => {});

            // Limpar erros e campos
            document.getElementById('loginSenha').value = '';
            document.getElementById('loginErroCamera').classList.add('hidden');
            document.getElementById('loginErroSenha').classList.add('hidden');
            document.getElementById('cameraPreview').style.display = 'none';
            document.getElementById('cameraPlaceholder').style.display = 'block';
            document.getElementById('btnIniciarCamera').classList.remove('hidden');
            document.getElementById('btnCapturarRosto').classList.add('hidden');

            mostrarTela('telaLogin');
            mudarAbaLogin('camera');
        }

        function voltarEscolha() {
            mostrarTela('telaEscolha');
        }

        async function fazerLogin() {
            const senha = document.getElementById('loginSenha').value;
            if (!senha) return;

            senhaDigitada = senha;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ perfil: perfilEscolhido, senha })
                });
                const data = await res.json();

                if (!res.ok) {
                    document.getElementById('loginErroMsg').textContent = data.erro || 'Senha incorreta';
                    document.getElementById('loginErro').classList.remove('hidden');
                    document.getElementById('loginSenha').value = '';
                    document.getElementById('loginSenha').focus();
                    return;
                }

                if (data.trocar_senha) {
                    document.getElementById('senhaAtual').value = senhaDigitada;
                    mostrarTela('telaTrocarSenha');
                    document.getElementById('senhaNova').focus();
                } else {
                    window.location.href = data.papel === 'morador' ? '/patrao.html' : '/empregada.html';
                }
            } catch(e) {
                document.getElementById('loginErroMsg').textContent = 'Erro de conexão. Tente novamente.';
                document.getElementById('loginErro').classList.remove('hidden');
            }
        }

        async function trocarSenha() {
            const atual = document.getElementById('senhaAtual').value;
            const nova = document.getElementById('senhaNova').value;
            const confirma = document.getElementById('senhaConfirma').value;

            if (nova.length < 4) {
                mostrarErroTroca('A nova senha deve ter pelo menos 4 caracteres');
                return;
            }
            if (nova !== confirma) {
                mostrarErroTroca('As senhas não conferem. Digite novamente.');
                return;
            }
            if (nova === '1234') {
                mostrarErroTroca('Escolha uma senha diferente da inicial (1234)');
                return;
            }

            try {
                const res = await fetch('/api/auth/trocar-senha', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ senha_atual: atual, senha_nova: nova })
                });
                const data = await res.json();

                if (!res.ok) {
                    mostrarErroTroca(data.erro || 'Erro ao trocar senha');
                    return;
                }

                alert('Senha alterada com sucesso! Não esqueça sua nova senha.');
                window.location.href = data.papel === 'morador' ? '/patrao.html' : '/empregada.html';
            } catch(e) {
                mostrarErroTroca('Erro de conexão. Tente novamente.');
            }
        }

        function mostrarErroTroca(msg) {
            document.getElementById('trocarErroMsg').textContent = msg;
            document.getElementById('trocarErro').classList.remove('hidden');
        }

        // ─── Funções de câmera para reconhecimento facial ───
        let streamCamera = null;

        function mudarAbaLogin(aba) {
            // Atualizar abas
            document.getElementById('tabCamera').classList.toggle('active', aba === 'camera');
            document.getElementById('tabSenha').classList.toggle('active', aba === 'senha');
            document.getElementById('abaCamera').classList.toggle('hidden', aba !== 'camera');
            document.getElementById('abaSenha').classList.toggle('hidden', aba !== 'senha');

            if (aba === 'camera') {
                // Focar no campo de senha se mudar para senha
                setTimeout(() => document.getElementById('loginSenha').focus(), 300);
            }
        }

        async function iniciarCamera() {
            try {
                document.getElementById('btnIniciarCamera').disabled = true;
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 320 } }
                });
                streamCamera = stream;
                const video = document.getElementById('cameraPreview');
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('cameraPlaceholder').style.display = 'none';
                document.getElementById('btnCapturarRosto').classList.remove('hidden');
                document.getElementById('btnIniciarCamera').classList.add('hidden');
            } catch (err) {
                document.getElementById('loginErroMsgCamera').textContent = 'Câmera não disponível. Use a senha.';
                document.getElementById('loginErroCamera').classList.remove('hidden');
                mudarAbaLogin('senha');
                document.getElementById('btnIniciarCamera').disabled = false;
            }
        }

        function pararCamera() {
            if (streamCamera) {
                streamCamera.getTracks().forEach(t => t.stop());
                streamCamera = null;
            }
            document.getElementById('cameraPreview').style.display = 'none';
            document.getElementById('cameraPlaceholder').style.display = 'block';
            document.getElementById('btnCapturarRosto').classList.add('hidden');
            document.getElementById('btnIniciarCamera').classList.remove('hidden');
            document.getElementById('btnIniciarCamera').disabled = false;
            voltarEscolha();
        }

        async function capturarRosto() {
            if (!streamCamera) return;

            // Por agora, mostrar um placeholder de reconhecimento
            // A implementação completa com face-api.js será adicionada depois
            document.getElementById('btnCapturarRosto').disabled = true;
            document.getElementById('btnCapturarRosto').textContent = '⏳ Analisando...';

            // Simular análise
            await new Promise(r => setTimeout(r, 1500));

            // Fallback para senha por enquanto
            document.getElementById('loginErroMsgCamera').textContent = 'Reconhecimento facial será habilitado em breve. Use a senha por enquanto.';
            document.getElementById('loginErroCamera').classList.remove('hidden');

            document.getElementById('btnCapturarRosto').disabled = false;
            document.getElementById('btnCapturarRosto').textContent = '✓ Verificar Rosto';

            mudarAbaLogin('senha');
        }

        function voltarEscolha() {
            pararCamera();
            mostrarTela('telaEscolha');
        }
    </script>

    <!-- Carregar face-api.js para reconhecimento facial (será usado depois) -->
    <script async defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</body>
</html>
